name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.2.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release title (defaults to version tag if blank)'
        required: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore WrathnillaTweaker.sln

      - name: Publish self-contained (includes .NET runtime)
        run: |
          $ver = "${{ github.event.inputs.version }}".TrimStart('v')
          dotnet publish WrathnillaTweaker/WrathnillaTweaker.csproj -c Release -r win-x64 /p:SelfContained=true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:Version=$ver /p:AssemblyVersion=$ver /p:FileVersion=$ver -o ./publish-scd

      - name: Publish framework-dependent (requires .NET 10 runtime)
        run: |
          $ver = "${{ github.event.inputs.version }}".TrimStart('v')
          dotnet publish WrathnillaTweaker/WrathnillaTweaker.csproj -c Release -r win-x64 /p:SelfContained=false /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:Version=$ver /p:AssemblyVersion=$ver /p:FileVersion=$ver -o ./publish-fdd

      - name: Rename artifacts
        run: |
          $ver = "${{ github.event.inputs.version }}"
          Move-Item ./publish-scd/WrathnillaTweaker.exe "WrathnillaTweaker-$ver-win-x64-standalone.exe"
          Move-Item ./publish-fdd/WrathnillaTweaker.exe "WrathnillaTweaker-$ver-win-x64-requires-dotnet10.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.release_name || github.event.inputs.version }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          body: |
            ## Downloads

            | File | Description |
            |------|-------------|
            | `WrathnillaTweaker-${{ github.event.inputs.version }}-win-x64-standalone.exe` | Self-contained — no installation required, runs on any Windows x64 machine |
            | `WrathnillaTweaker-${{ github.event.inputs.version }}-win-x64-requires-dotnet10.exe` | Smaller download — requires the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) to be installed |
          files: |
            WrathnillaTweaker-${{ github.event.inputs.version }}-win-x64-standalone.exe
            WrathnillaTweaker-${{ github.event.inputs.version }}-win-x64-requires-dotnet10.exe